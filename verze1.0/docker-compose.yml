services:

  # ── PHP web aplikace ───────────────────────────────────────────
  gridsight:
    image: ghcr.io/hacesoft/gridsight:latest
    # Pro lokální build ze zdrojů odkomentuj:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: gridsight
    restart: unless-stopped
    ports:
      - "5080:80"
    volumes:
      - gridsight-data:/data
      - ./php:/var/www/html    
    environment:
      - DATA_DIR=/data
      - TZ=Europe/Prague
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api.php?action=range"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - gridsight

  # ── Python Modbus poller (Cerbo GX) ───────────────────────────
  gridsight-modbus:
    image: ghcr.io/hacesoft/gridsight-modbus:latest
    # Pro lokální build:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.modbus
    container_name: gridsight-modbus
    restart: unless-stopped
    volumes:
      - gridsight-data:/data   # sdílí SQLite DB s PHP kontejnerem
    environment:
      - DATA_DIR=/data
      - TZ=Europe/Prague
    # Cerbo host, port and polling interval are configured through the GridSight web UI
    # and stored in the shared SQLite database, not in compose environment variables.
    depends_on:
      - gridsight
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - gridsight

volumes:
  gridsight-data:
    driver: local

networks:
  gridsight:
    driver: bridge
