services:
  gridsight:
    image: hacesoft/gridsight:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridsight
    restart: unless-stopped
    ports:
      - "5080:80"
    volumes:
      - ./data:/data
      - ./php:/var/www/html      # ← živé PHP soubory bez rebuildu
    environment:
      - DATA_DIR=/data
      - TZ=Europe/Prague
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api.php?action=range"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - gridsight

  gridsight-modbus:
    image: hacesoft/gridsight-modbus:latest
    build:
      context: .
      dockerfile: Dockerfile.modbus
    container_name: gridsight-modbus
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./modbus:/app            # ← živé Python soubory
    environment:
      - DATA_DIR=/data
      - TZ=Europe/Prague
      - CERBO_IP=192.168.50.200
      - POLL_INTERVAL=1
    depends_on:
      - gridsight
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - gridsight

networks:
  gridsight:
    driver: bridge