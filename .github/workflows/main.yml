name: Build & Publish Docker Images

on:
  push:
    branches: ["main"]
    tags:     ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PHP_IMAGE:    ghcr.io/${{ github.repository }}
  MODBUS_IMAGE: ghcr.io/${{ github.repository }}-modbus

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ověř strukturu projektu
        run: |
          echo "=== Obsah repo ==="
          find . -not -path './.git/*' -not -path './php/vendor/*' | sort
          echo "=== PHP views ==="
          ls -la php/views/ || echo "CHYBA: php/views/ nenalezeno!"
          echo "=== CSS/JS assets ==="
          ls -la php/public/assets/css/ php/public/assets/js/ || echo "CHYBA: assets nenalezeny!"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login do GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache pip  # Cache pro pip (Python knihovny)
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('modbus/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── Metadata pro PHP image ──────────────────────────────────
      - name: Metadata PHP image
        id: meta-php
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PHP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Cache PHP ──────────────────────────────────
      - name: Cache APT (Debian)
        uses: actions/cache@v3
        with:
          path: |
            /var/lib/apt/lists/
            /var/cache/apt/archives/
          key: ${{ runner.os }}-apt-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-apt-
      
      # ── Build + push PHP image ──────────────────────────────────
      - name: Build & push PHP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags:   ${{ steps.meta-php.outputs.tags }}
          labels: ${{ steps.meta-php.outputs.labels }}
          cache-from: type=gha,scope=php
          cache-to:   type=gha,scope=php,mode=max

      # ── Metadata pro Modbus image ───────────────────────────────
      - name: Metadata Modbus image
        id: meta-modbus
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.MODBUS_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Build + push Modbus image ───────────────────────────────
      - name: Build & push Modbus image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.modbus
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags:   ${{ steps.meta-modbus.outputs.tags }}
          labels: ${{ steps.meta-modbus.outputs.labels }}
          cache-from: type=gha,scope=modbus
          cache-to:   type=gha,scope=modbus,mode=max
