name: Build & Publish Docker Images

on:
  push:
    branches: ["main"]
    tags:     ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:         # ruční spuštění přes GitHub UI

env:
  PHP_IMAGE:    hacesoft/gridsight         # PHP aplikace na Docker Hub
  MODBUS_IMAGE: hacesoft/gridsight-modbus  # Python Modbus sběrač na Docker Hub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # čtení repo – nepotřebujeme packages:write (to bylo pro GHCR)

    steps:
      # ── Stažení kódu z repo ─────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Ověření že jsou všechny soubory na místě ────────────────
      - name: Ověř strukturu projektu
        run: |
          echo "=== Obsah repo ==="
          find . -not -path './.git/*' -not -path './php/vendor/*' | sort
          echo "=== PHP views ==="
          ls -la php/views/ || echo "CHYBA: php/views/ nenalezeno!"
          echo "=== CSS/JS assets ==="
          ls -la php/public/assets/css/ php/public/assets/js/ || echo "CHYBA: assets nenalezeny!"

      # ── Buildx umožňuje multi-platform build (amd64 + arm64) ────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Přihlášení na Docker Hub (jen při push, ne pull_request) ─
      - name: Login do Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Cache Python knihoven (pymodbus atd.) ───────────────────
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('modbus/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── Cache APT balíčků (libsqlite3-dev, libgd atd.) ──────────
      - name: Cache APT
        uses: actions/cache@v3
        with:
          path: |
            /var/lib/apt/lists/
            /var/cache/apt/archives/
          key: ${{ runner.os }}-apt-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      # ── Tagy pro PHP image (latest, main, verze) ────────────────
      - name: Metadata PHP image
        id: meta-php
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PHP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Build PHP image a push na Docker Hub ────────────────────
      - name: Build & push PHP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64   # NAS může být arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags:   ${{ steps.meta-php.outputs.tags }}
          labels: ${{ steps.meta-php.outputs.labels }}
          cache-from: type=gha,scope=php
          cache-to:   type=gha,scope=php,mode=max

      # ── Tagy pro Modbus image ────────────────────────────────────
      - name: Metadata Modbus image
        id: meta-modbus
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.MODBUS_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Build Modbus image a push na Docker Hub ──────────────────
      - name: Build & push Modbus image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.modbus
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags:   ${{ steps.meta-modbus.outputs.tags }}
          labels: ${{ steps.meta-modbus.outputs.labels }}
          cache-from: type=gha,scope=modbus
          cache-to:   type=gha,scope=modbus,mode=max
